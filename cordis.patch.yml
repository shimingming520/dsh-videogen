# dsh-videogen bundle patch: inserts the plugin row into the web profile
# roster. The node half (exports ".") runs in the host process (settings
# bridge, video-generation proxy, ffmpeg processing and storyboard routes),
# and the `dsh.client` declaration in package.json makes the browser half
# (exports "./client", served at /plugins/<id>/client.js) load in the web GUI.
- insert:
    - id: videogen
      name: dsh-videogen
